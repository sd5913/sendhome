<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>送小鱼回家 · 关卡 1</title>
<link rel="stylesheet" href="style.css?v=shared-1">
</head>
<body><main>
<header><div><span class="eyebrow">SEND FISH HOME</span><h1 id="title">送小鱼回家</h1><p id="subtitle">正在加载关卡…</p></div><label class="brief">选择关卡 <select id="level-picker" aria-label="选择关卡"></select></label></header>
<div class="layout"><section class="stage" aria-label="游戏区域"><div class="canvas-box"><canvas id="game" width="1152" height="792" tabindex="0" aria-label="横版合作解谜游戏，使用方向键移动和空格跳跃，点击小鱼可切换角色"></canvas><div class="done-overlay" id="level-done" hidden><button id="next-level" type="button">下一关</button><span class="done-note" id="done-note"></span></div></div><p id="message" class="message" role="status" aria-live="polite"></p><div class="legend"><span>▧ 1 格 = 36 px</span><span>绿色边缘 = 可落脚平台</span><span>同色道具 = 同一组机关</span><span>发光门 = 集合点</span></div><div class="touch" aria-label="触屏操作"><button data-hold="left" aria-label="向左">←</button><button data-hold="right" aria-label="向右">→</button><button id="jump">跳跃 ↑</button><button data-hold="dash">冲刺</button></div></section>
<aside><div><h2>三位伙伴</h2><button id="sound" type="button" aria-pressed="true" aria-label="切换游戏音效">音效：开</button><div id="fish-list"></div><p class="help">A / D 或 ← → 移动<br>W / 空格 / ↑ 跳跃<br>1 / 2 / 3、Tab 或点击小鱼切换<br>Shift 冲刺 · Esc 暂停 · 长按 R 重置</p></div><div><h2>集合进度</h2><dl class="stats"><dt>检查点</dt><dd id="count">0 / 3</dd><dt>用时</dt><dd id="time">0.0 s</dd><dt>脚下</dt><dd id="support">起点平台</dd><dt>背上总重量</dt><dd id="load">0</dd><dt>移动速度比例</dt><dd id="speed">100%</dd><dt>已完成关卡</dt><dd id="levels">0</dd></dl><div class="actions"><button id="pause">暂停</button><button id="reset">重新开始</button></div><p class="help" id="level-help"></p></div></aside></div>
<footer>角色与场景美术取自设计稿（<code>game/art</code>）· 所有关卡共享角色与机关规则 · <a href="../game-whitebox/">机关测试关</a></footer>
</main><script type="module" src="app.mjs?v=shared-1"></script></body></html>
