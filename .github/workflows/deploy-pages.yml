name: Deploy game to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - index.html
      - level-1/**
      - game-whitebox/**
      - .github/workflows/deploy-pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Prepare game website
        run: |
          mkdir -p _site/level-1 _site/game-whitebox
          cp index.html _site/
          cp level-1/index.html level-1/game.mjs level-1/engine.mjs _site/level-1/
          cp game-whitebox/index.html game-whitebox/game.js _site/game-whitebox/
          touch _site/.nojekyll
      - name: Upload website
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./_site
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
